# Publica a Cloud Function boasVindas (e-mail de boas-vindas via Resend) pela nuvem.
# Só roda quando alguém clica: Actions -> "Publicar function boasVindas" -> Run workflow.
# NUNCA dispara por push. Passos únicos de configuração: README.md, "Publicar pela nuvem".
#
# Grava o secret RESEND_API_KEY no Firebase a partir do secret do GitHub de mesmo nome
# (entra por variável de ambiente e stdin; nunca vai para a linha de comando nem para o log).
name: Publicar function boasVindas

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'O que está subindo (fica no log)'
        required: false
        default: 'publicação manual'

permissions:
  contents: read
  id-token: write # só usado no modo WIF

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar, compilar e testar as functions
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test

      - name: Autenticar (chave JSON)
        if: ${{ vars.GCP_WIF_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Autenticar (Workload Identity Federation)
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Gravar o secret RESEND_API_KEY no Firebase
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "FALTA o secret RESEND_API_KEY no GitHub (veja README, 'Publicar pela nuvem')."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx --yes firebase-tools@latest \
            functions:secrets:set RESEND_API_KEY --data-file - \
            --project tanocaixa --non-interactive --force >/dev/null
          echo "Secret RESEND_API_KEY gravado (valor não exibido)."

      - name: Deploy só da boasVindas
        env:
          MOTIVO: ${{ inputs.motivo }}
        run: |
          echo "Motivo: $MOTIVO"
          npx --yes firebase-tools@latest deploy --only functions:boasVindas \
            --project tanocaixa --non-interactive --force
